[package]
name = "weas"
version = "0.1.0"
edition = "2021"
authors = ["KlTlK"]
description = "Next-generation VPN client powered by sing-box in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KlTlK/weas"

[dependencies]
eframe = { version = "0.37", default-features = true }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
url = "2.5"
urlencoding = "2.1"
colored = "3.1"
directories = "6.0"
futures-util = "0.3"
ctrlc = "3.4"
zip = { version = "9.7", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
